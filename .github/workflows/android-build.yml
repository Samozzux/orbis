# Build Android (ARM64, IL2CPP, Vulkan + OpenGL ES 3) → Orbis.apk firmato (artifact "Orbis-apk").
name: Android build

on:
  # come da docs/07 §2: le build partono dopo l'unione in main, sui tag v* e a mano (Actions → Run workflow)
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'data/localization/**'
      - '.github/workflows/android-build.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write # per allegare l'APK alla Release sui tag


jobs:
  build:
    name: android
    # una build Unity alla volta in tutto il repository (licenza Personal, docs/07 §2):
    # le altre aspettano in coda, nessuna viene annullata
    concurrency:
      group: unity-license
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Libera spazio su disco
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Versione
        run: .github/scripts/orbis-env.sh

      - name: Cache Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            Library-Android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-

      - name: Installa Unity
        uses: buildalon/unity-setup@v3
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          build-targets: Android

      - name: Attiva la licenza Unity
        uses: buildalon/activate-unity-license@v3
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Keystore di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/orbis.keystore"
            echo "ORBIS_KEYSTORE_PATH=$RUNNER_TEMP/orbis.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 assente: APK firmato con chiave di debug"
          fi

      - name: Build
        env:
          ORBIS_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ORBIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORBIS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          .github/scripts/run-unity.sh -quit -buildTarget Android \
            -executeMethod Orbis.EditorTools.Build.BuildScript.BuildAndroid
          rm -f "$RUNNER_TEMP/orbis.keystore"
          test -f build/android/Orbis.apk

      - name: Firma dell'APK
        run: |
          apksigner=$(find "$(dirname "$UNITY_EDITOR_PATH")" -name apksigner -type f 2>/dev/null | sort | tail -n 1)
          size=$(du -h build/android/Orbis.apk | cut -f1)
          {
            echo "### APK: ${size}"
            if [ -n "$apksigner" ]; then
              echo '```'
              "$apksigner" verify --print-certs build/android/Orbis.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: Orbis-apk
          path: build/android/Orbis.apk
          retention-days: 30

      - name: Allega alla Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/android/Orbis.apk
